set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# tmux >= 3.8 ships its own colour theme; keep using the terminal's colours
set -g theme terminal
# size windows to the largest client looking at them, not the smallest attached one
setw -g aggressive-resize on

unbind C-b
set -g prefix C-a

# spltting
unbind %
bind | split-window -h
# vertical
unbind '"'
bind - split-window -v

# reloading config
unbind r
bind r source-file ~/.tmux.conf

# resizing
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# mouse support
set -g mouse on

# min and max panes
bind -r m resize-pane -Z

set-window-option -g mode-keys vi

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
# catppuccin v2.x options (the v0.x names were silently ignored)
set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_directory_text " #{pane_current_path}"

bind-key g display-popup -d "$HOME/scripts" -w 60% -h 60% ./query-llm.sh
bind-key v display-popup -d "#{pane_current_path}"
# set-environment -g PATH "/usr/local/bin:/bin:/usr/bin:/opt/homebrew/bin/:/usr/sbin:/sbin:/bin/zsh"

set-option -g default-shell /bin/zsh

run-shell "$HOME/.tmux/plugins/tpm/tpm"

# status modules must be set after catppuccin has loaded (via tpm above)
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_session}"

# tmux >= 3.8 needs fill= to clear the status line behind the prompt/messages;
# catppuccin's message styles drop it, so the prompt overlapped the window list
set -g message-style "fg=#{@thm_teal},bg=#{@thm_mantle},align=centre,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#{@thm_mantle}}"
set -g message-command-style "fg=#{@thm_teal},bg=#{@thm_mantle},align=centre,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#{@thm_mantle}}"


bind-key -T copy-mode-vi v send-keys -X begin-selection

