status_path "~/.local/share/pimsync/status/"

storage calendars_remote {
	type caldav
	url "https://caldav.icloud.com"
	username "anloehr@icloud.com"
	password {
		shell "tr -d '\n' < ~/.config/pimsync/caldav-password"
	}
}

storage calendars_local {
	type vdir/icalendar
	path ~/GlobalSync/calendars/
	fileext ics
}

# "Org Agenda" calendar only
pair calendars {
	storage_a calendars_local
	storage_b calendars_remote
	collection "056CB398-5017-4BE6-A1AB-FA606ED0EC5E"
	conflict_resolution keep a
}
